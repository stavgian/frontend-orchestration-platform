<div class="host-wrapper">
  @if (loading) {
    <div class="host-status" role="status">
      <span class="spinner" aria-hidden="true"></span> Loading app…
    </div>
  }
  @if (error) {
    <div class="host-error host-ended" role="alert">
      <span><strong>Could not load this app.</strong> Is it running?</span>
      <small>{{ error }}</small>
      @if (definition) {
        <button type="button" class="btn-ghost" (click)="retry()">Try again</button>
      }
    </div>
  }
  <div #host class="mfe-host" [class.dimmed]="loading"></div>
</div>
